[build-system]
requires = ["uv_build>=0.7.0,<0.13.0"]
build-backend = "uv_build"


[project]
name = "hashwalk"
version = "0.5.0"
description = "Hashwalk"
requires-python = ">=3.12"
authors = [
    { name = "Miles Smith", email = "miles-smith@omrf.org" }
]
license = "MIT"
readme = "README.rst"
classifiers = [
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "joblib>=1.5.3",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.urls]
homepage = "https://github.com/milescsmith/hashwalk"
repository = "https://github.com/milescsmith/hashwalk"
documentation = "https://hashwalk.readthedocs.io"
Changelog = "https://github.com/milescsmith/hashwalk/releases"

[project.scripts]
hashwalk = "hashwalk.__main__:app"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["hashwalk"]

[tool.coverage.report]
show_missing = true
fail_under = 100


[dependency-groups]
dev = [
    "coverage>=7.9.2",
    "nox>=2025.5.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.3",
    "ty>=0.0.1a14",
    "typeguard>=4.4.4",
]
